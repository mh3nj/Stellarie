name: Build desktop apps

# Manual runs on demand, plus a build whenever a version tag is pushed. Pull
# requests only build (no packaging) so a broken build is caught before merge
# without producing throwaway installers.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            label: Linux (amd64)
            artifact: stellarei-linux-amd64
          - os: macos-latest
            platform: darwin
            label: macOS (universal)
            artifact: stellarei-macos
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Wails v3 links against GTK/WebKit on Linux, so the -dev packages have
      # to be present before `go build` runs. Ubuntu 24.04 ships WebKitGTK 4.1;
      # the 4.0 fallback keeps older images working too.
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            || sudo apt-get install -y \
              build-essential pkg-config \
              libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev

      - name: Install the Wails v3 CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.22
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify Go code
        run: |
          go build ./...
          go vet ./...
          go test ./...

      - name: Build the frontend and app
        run: wails3 task ${{ matrix.platform }}:build

      - name: Package (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: wails3 task ${{ matrix.platform }}:package

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: warn
          path: |
            bin/**
            build/linux/*.desktop
